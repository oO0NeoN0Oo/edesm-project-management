name: Splunk CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fail if Dashboard Studio JSON dashboards exist
        run: |
          if find . -type f -name "*.json" | grep -q .; then
            echo "ERROR: Dashboard Studio JSON dashboards are not allowed."
            find . -type f -name "*.json"
            exit 1
          fi

      - name: Validate XML dashboards
        run: |
          echo "Validating XML dashboards..."
          for file in $(find . -type f -name "*.xml"); do
            echo "Checking $file"
            xmllint --noout "$file"
          done

      - name: Check required Splunk app files
        run: |
          echo "Checking required Splunk app files..."
          test -f default/app.conf || (echo "Missing default/app.conf" && exit 1)
          test -f metadata/local.meta || (echo "Missing metadata/local.meta" && exit 1)

  deploy-app:
    needs: validate-app
    runs-on: ubuntu-latest

    env:
      SPLUNK_BASE_URL: ${{ secrets.SPLUNK_BASE_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy XML dashboards
        run: |
          echo "Deploying XML dashboards..."
          for file in $(find . -type f -name "*.xml"); do
            base=$(basename "$file" .xml)
            echo "Uploading $base"
            curl -k -X POST \
              -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
              --data-urlencode "name=$base" \
              --data-urlencode "eai:data=$(cat $file)" \
              "${SPLUNK_BASE_URL}/servicesNS/nobody/${GITHUB_REPOSITORY##*/}/data/ui/views"
          done

      - name: Deploy HTML dashboards
        run: |
          echo "Deploying HTML dashboards..."
          for file in $(find . -type f -name "*.html"); do
            base=$(basename "$file" .html)
            echo "Uploading $base"
            curl -k -X POST \
              -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
              --data-urlencode "name=$base" \
              --data-urlencode "eai:data=$(cat $file)" \
              "${SPLUNK_BASE_URL}/servicesNS/nobody/${GITHUB_REPOSITORY##*/}/data/ui/views"
          done

      - name: Deploy navigation
        run: |
          if [ -f default/data/ui/nav/default.xml ]; then
            echo "Deploying navigation..."
            curl -k -X POST \
              -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
              --data-urlencode "name=default" \
              --data-urlencode "eai:data=$(cat default/data/ui/nav/default.xml)" \
              "${SPLUNK_BASE_URL}/servicesNS/nobody/${GITHUB_REPOSITORY##*/}/data/ui/nav"
          fi

      - name: Reload app (zero downtime)
        run: |
          echo "Reloading app..."
          curl -k -X POST \
            -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
            "${SPLUNK_BASE_URL}/servicesNS/nobody/${GITHUB_REPOSITORY##*/}/admin/apps/local/${GITHUB_REPOSITORY##*/}/reload"

      - name: Install SPL package into Splunk
        run: |
          echo "Installing SPL package..."
          curl -k -X POST \
            -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
            -F "name=${GITHUB_REPOSITORY##*/}" \
            -F "update=true" \
            -F "filename=@build/${GITHUB_REPOSITORY##*/}.spl" \
            "${SPLUNK_BASE_URL}/services/apps/local"

  package-app:
    needs: deploy-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build SPL package
        run: |
          echo "Building SPL package..."
          mkdir build
          tar -cvzf build/${GITHUB_REPOSITORY##*/}.spl .

      - name: Upload SPL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${GITHUB_REPOSITORY##*/}.spl
          path: build/${GITHUB_REPOSITORY##*/}.spl






