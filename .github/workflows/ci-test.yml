name: Splunk CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fail if Dashboard Studio JSON dashboards exist
        run: |
          if find . -type f -name "*.json" | grep -q .; then
            echo "ERROR: Dashboard Studio JSON dashboards are not allowed."
            find . -type f -name "*.json"
            exit 1
          fi

      - name: Validate XML dashboards
        run: |
          echo "Validating XML dashboards..."
          for file in $(find . -type f -name "*.xml"); do
            echo "Checking $file"
            xmllint --noout "$file"
          done

      - name: Check required Splunk app files
        run: |
          echo "Checking required Splunk app files..."
          test -f default/app.conf || (echo "Missing default/app.conf" && exit 1)
          test -f metadata/local.meta || (echo "Missing metadata/local.meta" && exit 1)

  package-app:
    needs: validate-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build SPL package
        run: |
          echo "Building SPL package..."
          mkdir -p build
          mkdir -p ${{ github.event.repository.name }}
          cp -r bin default local metadata static appserver ${{ github.event.repository.name}}/
          tar -cvzf build/${{ github.event.repository.name }}.spl ${{ github.event.repository.name}}/
          ls -lh build

      - name: Upload SPL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.spl
          path: build/${{ github.event.repository.name }}.spl

  deploy-app:
    needs: package-app
    runs-on: ubuntu-latest

    env:
      SPLUNK_BASE_URL: ${{ secrets.SPLUNK_BASE_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download SPL artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}.spl
          path: build

      - name: Verify SPL file exists
        run: |
          echo "Checking build directory..."
          ls -lh build

      #testing splunk connectivity
      - name: Test Splunk connectivity
        run: |
          echo "Confirming Splunk connection including token..." \
          curl -v \
            -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
            ${SPLUNK_BASE_URL}/services/server/info

      - name: Install SPL package into Splunk
        run: |
          echo "Installing SPL package..."
          curl -v -k \
            -H "Authorization: Bearer ${SPLUNK_TOKEN}" \
            "${SPLUNK_BASE_URL}/services/apps/local" \
            --data-urlencode "name=deployment-demo" \
            --data-urlencode "template=deployment_app" \
            --data-urlencode "label=Deployment Demo"
#            --data-urlencode "name=@build/${{ github.event.repository.name }}.spl" \
#            --data-urlencode "filename=true" \
#            --data-urlencode "update=true" \





